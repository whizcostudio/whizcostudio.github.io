<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhizCo Studio</title>
<meta name="description" content="WhizCo Studio makes small, polished casual games for Android.">
<style>
  :root { --bg:#fbfaf6; --text:#1f2328; --muted:#5b636e; --accent:#2f7d32; --rule:#e3e0d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15181c; --text:#e8e6e1; --muted:#a3a9b1; --accent:#7cc47f; --rule:#2c3137; } }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 16px 64px; }
  h1 { font-size: 2.2rem; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 40px 0 8px; padding-top: 20px; border-top: 1px solid var(--rule); }
  p.lead { color: var(--muted); margin: 0; }
  a { color: var(--accent); }
  footer { margin-top: 48px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>WhizCo Studio</h1>
  <p class="lead">Small, polished casual games for Android.</p>

  <h2>IsoHopper: Farm Animal Hop</h2>
  <p>Swipe to hop your farm animal across roads, rivers and railways. Plays offline, no account needed.</p>
  <p><a href="isohopper/privacy.html">Privacy policy</a></p>

  <h2>Contact</h2>
  <p><a href="mailto:contact@whizcorps.com">contact@whizcorps.com</a></p>

  <footer>&copy; 2026 WhizCo Studio</footer>
</main>
</body>
</html>
